name = "fetchit-bridge-worker"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Bind on the etchit.io zone to ONLY the fediverse routes. Every other
# path (the marketing site) is served straight from GitHub Pages and
# never reaches this Worker. Deployed on the etchit.io Cloudflare account
# (Josh-direct). `wrangler deploy` binds these routes.
#
# The webfinger pattern MUST end in `*`: a Cloudflare route without a
# trailing wildcard does not match a URL that carries a query string, and
# every real WebFinger request is `?resource=acct:...`. Without the `*`
# the query-bearing request falls through to GitHub Pages. The Worker's
# classify() still exact-matches `/.well-known/webfinger` on the path, so
# the wildcard widens the route, not the proxy (no open-proxy risk).
#
# The `/v1/actors` registry write surface is fronted the same way: the
# exact route carries the POST that registers a handle, the wildcard
# carries the PUT that rotates a relay hint. classify() pins the method
# per path, so widening the route does not widen the proxy.
routes = [
  { pattern = "etchit.io/.well-known/webfinger*", zone_name = "etchit.io" },
  { pattern = "etchit.io/actors", zone_name = "etchit.io" },
  { pattern = "etchit.io/actors/*", zone_name = "etchit.io" },
  { pattern = "etchit.io/v1/actors", zone_name = "etchit.io" },
  { pattern = "etchit.io/v1/actors/*", zone_name = "etchit.io" },
]

[vars]
# The deployed bridge's HTTPS origin, e.g. https://bridge.etchit.io
# Left empty here on purpose; set the real value at deploy time:
#   wrangler deploy --var BRIDGE_ORIGIN:https://<bridge-host>
# The Worker returns 503 until BRIDGE_ORIGIN is set.
BRIDGE_ORIGIN = ""
