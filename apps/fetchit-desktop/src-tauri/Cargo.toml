[package]
name = "fetchit-desktop"
version = "0.2.8"
description = "Desktop reader for content stored on the Autonomi network."
authors = ["the fetch>it contributors"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
# `_lib` so the library name doesn't collide with the binary name (a Windows quirk).
name = "fetchit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Desktop E2E build: fetch_and_render serves in-process fixtures
# instead of fetching from the network. Never enabled by a release build.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "process", "time"] }
# `CancellationToken` for aborting in-flight fetches when the user
# closes a tab or restarts the fetch. The token is dropped through
# `tokio::select!` so the inner network ops cancel at their next
# `.await`.
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1.7"
infer = { version = "0.16", default-features = false }
filetime = "0.2"
tauri-plugin-clipboard-manager = "2"
# PNG → RGBA decode for `copy_png_to_clipboard`. Tauri's clipboard plugin
# takes RGBA bytes, not encoded PNG, so we decode here. `png` is the
# minimal crate that does it — no JPEG / GIF / TIFF baggage.
png = "0.17"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
# Multiplex `autonomi://` / `fetchit://` URL launches into one running
# fetch>it process instead of spawning a fresh instance per click. The
# secondary invocation's argv is forwarded to the existing instance,
# which focuses its window and re-emits the URL so the same deep-link
# handler that fires on first-launch runs again and the tab strip
# picks up a new tab.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# OS-native toast notifications for inbound DMs delivered while the
# window is unfocused; the chat panel falls back gracefully if the
# user hasn't granted permission.
tauri-plugin-notification = "2"
# Structured logging for the supervisor + boot path. The `log` feature
# makes `tracing::warn!` etc. also emit as `log` events so they flow
# through `tauri-plugin-log`'s `log`-crate facade without a custom
# subscriber. Matches fetchit-chat which depends on `tracing` directly.
tracing = { version = "0.1", features = ["log"] }
# Wires the `log` crate facade to per-target writers (stdout in dev,
# rotated files in prod). Picks up every `tracing::*` event because of
# the `tracing/log` feature above.
tauri-plugin-log = "2"
fetchit-core = { path = "../../../crates/fetchit-core" }
fetchit-net = { path = "../../../crates/fetchit-net" }
fetchit-chat = { path = "../../../crates/fetchit-chat" }
# Direct dep for the M4 compose commands: `PublicPost` (the publish
# payload) and `parse_mention` (the mention-extraction oracle).
fetchit-fedi = { path = "../../../crates/fetchit-fedi" }
# Direct dep so the chat layer can name relay-proto types (e.g.
# `AgentId`, `PresenceUpdate`) when wiring the new presence pump.
fetchit-relay-proto = { path = "../../../crates/fetchit-relay-proto" }
# Direct dep so the boot path can name `ReqwestClient` (the production
# denylist HTTP poller) plus `BlockEvent` / `EntryKind` for the M3
# denylist install + the chat:denylist-updated pump.
fetchit-trust-client = { path = "../../../crates/fetchit-trust-client", features = ["reqwest"] }
# Direct dep so `AppState` can name the `DenylistQuery` trait object the
# reader-side denylist gate stores + threads into `render_with_context`.
fetchit-trust-types = { path = "../../../crates/fetchit-trust-types" }
x0xd-client = { path = "../../../crates/x0xd-client" }
semver = "1"
hex = "0.4"
url = "2.5"
# Used only by refresh_peers_from_upstream to GET WithAutonomi's
# canonical bootstrap_peers.toml. rustls-tls keeps us off the system
# OpenSSL dep tree on Linux.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Parse the upstream bootstrap_peers.toml. Tolerant scan over any TOML
# string leaves that pass parse_bootstrap_peer, so a future minor
# schema rotation at WithAutonomi doesn't blow up the refresh.
toml = "0.8"
# Portable OS config-dir lookup (XDG on Linux, APPDATA on Windows,
# ~/Library/Application Support on macOS).
dirs = "5"
# Enumerate the host's non-loopback network interfaces so the LAN-direct
# mDNS announcement can publish concrete reachable IPs. Pure-Rust,
# no system deps.
if-addrs = "0.13"
# Direct dep so we can call `ServiceDaemon` / `build_service_info` /
# `spawn_browser` to drive the mDNS lifecycle from the desktop layer;
# fetchit-chat is the structural home of these helpers.
mdns-sd = { version = "0.20", default-features = false }

[dev-dependencies]
tempfile = "3"

# This crate is `exclude`d from the workspace (Tauri's dep tree shouldn't
# bloat the workspace `cargo` invocation), so the workspace's
# `[workspace.lints]` block doesn't apply automatically. Mirror the
# safety-relevant subset here so the security claims in `docs/SECURITY.md`
# are actually enforced by the build. `unreachable_pub` is dropped because
# everything in a Tauri binary is effectively internal API.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Tauri command + URI-scheme handlers must take their args (State,
# AppHandle, WebviewWindow, the IPC-deserialized String / Vec) by value —
# the framework's macros require it; the lint can't see that contract.
needless_pass_by_value = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
