[package]
name = "fetchit-chat"
description = "Rust client for the x0xd gossip-network daemon — chat, contacts, presence, groups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "fetchit-chat-peer"
path = "src/bin/peer.rs"
required-features = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
fetchit-relay-client = { path = "../fetchit-relay-client" }
fetchit-relay-proto = { path = "../fetchit-relay-proto" }
futures-util.workspace = true
hex.workspace = true
log.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tempfile = "3.13"
wiremock = "0.6"
