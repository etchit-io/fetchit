[package]
name = "fetchit-core"
description = "Universal read-only viewer engine for content stored on the Autonomi network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
infer = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
once_cell = "1.20"
regex = "1.11"
# ZIP archive enumeration — no decompression needed (we list entries
# only), so default-features off keeps the engine binary small.
zip = { version = "2.2", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
