[package]
name = "fetchit-core"
description = "Universal read-only viewer engine for content stored on the Autonomi network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
infer = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
regex = "1.11"
# ZIP archive enumeration + per-entry extraction. `deflate` is the only
# decompression algorithm we enable — covers ~all real archives without
# pulling in bzip2 / lzma / zstd binary bloat.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# M3 Phase F2 — DenylistQuery trait + EntryKind discriminant for the
# render-time short-circuit (`HandlerRegistry::render_with_context`).
# fetchit-trust-types is a serde-only leaf crate, so the stateless
# reader engine never pulls the trust server stack (axum, async runtime,
# PQ signer) just to name these two items.
fetchit-trust-types = { path = "../fetchit-trust-types" }

[dev-dependencies]
tokio = { workspace = true }
