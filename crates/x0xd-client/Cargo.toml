[package]
name = "x0xd-client"
description = "Slim client for a local x0xd daemon — discovery of the data directory and a Signer that delegates ML-DSA-65 operations to /agent/sign."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
fetchit-relay-proto = { path = "../fetchit-relay-proto" }
hex.workspace = true
reqwest.workspace = true
semver = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
url.workspace = true
which = "6"

[dev-dependencies]
tempfile = "3.13"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
wiremock = "0.6"
