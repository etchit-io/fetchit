[package]
name = "fetchit-ffi"
description = "FFI bindings (uniffi 0.29.x) over fetchit-core + fetchit-net for Kotlin/Swift consumers."
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"
homepage = "https://github.com/etchit-io/fetchit"
repository = "https://github.com/etchit-io/fetchit"
authors = ["the fetch>it contributors"]

# fetchit-ffi sits OUTSIDE the main workspace by deliberate choice.
# `uniffi-bindgen` walks all transitive deps when run against a
# workspace `.so` and fails the metadata lookup silently when the
# tree is large. Etchit hits the same behaviour and uses the same
# fix — keep the FFI crate in its own Cargo island, with path deps
# back into the main workspace's library crates.

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
fetchit-core = { path = "../fetchit-core" }
fetchit-net = { path = "../fetchit-net" }
fetchit-chat = { path = "../fetchit-chat" }
fetchit-fedi = { path = "../fetchit-fedi" }
fetchit-relay-proto = { path = "../fetchit-relay-proto" }
fetchit-trust-client = { path = "../fetchit-trust-client", features = ["reqwest"] }
# Embedded x0xd: connect() runs x0x::daemon::serve() in-process on a loopback
# port so groups get a /secure/* TreeKEM surface on Android without a separate
# daemon. josh-clsn/x0x fork (mobile-serve-entrypoint) -- adds the opt-in
# DaemonConfig.identity_dir override serve() needs when there is no writable
# home. Heavy: pulls the full ant-quic + saorsa-gossip native stack.
# Post-G1: upstream v0.34.3 plus the ONE remaining fork commit -- engine-A's
# relay-delivered group-join apply endpoints (branch engine-a-34 on
# josh-clsn/x0x). G1 (2026-07-25) proved a CGNAT phone OWNER cannot converge
# groups on pure gossip: MemberJoined delivery landed 1 of 2 rounds and the
# TreeKEM Welcome hand-off 0 of 1, with nothing re-arming either. Engine-A is
# that missing deterministic lane. See fetchit-ops/docs/x0x-defork-plan.md.
x0x = { path = "../../../x0x-tail-34" }
# rustls 0.23 cannot auto-pick a CryptoProvider when both aws-lc-rs and ring
# are in the dependency graph (the x0x embed above pulls both). This direct dep
# makes rustls::crypto::aws_lc_rs reachable so connect() installs it explicitly.
# Caret on the minor (not a patch pin) so it unifies with whatever 0.23.x the
# embed resolves -- a future ant-quic/x0x bump cannot skew the provider module
# out from under install_default.
rustls = "0.23"
# Exact-pinned: the uniffi runtime must match the uniffi-bindgen CLI version
# (scripts/build-jni-libs.sh) — a mismatch fails the generated bindings'
# API-checksum check at startup. Bump the runtime and the CLI together.
uniffi = { version = "=0.29.5", features = ["tokio"] }
bytes = "1.7"
hex = "0.4"
log = "0.4"
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[dev-dependencies]
tempfile = "3"
# For tests/identity_unification.rs: proves the chat vault's ML-DSA-65 agent
# id equals x0x's AgentKeypair agent id for the same key bytes, across the two
# linked saorsa-pqc versions -- the invariant the daemonless x0xd-adopts-vault
# identity seed relies on.
fetchit-relay-client = { path = "../fetchit-relay-client" }

[build-dependencies]
uniffi = { version = "=0.29.5", features = ["build"] }
