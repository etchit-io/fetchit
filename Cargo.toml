[workspace]
members = [
    "crates/fetchit-core",
    "crates/fetchit-net",
    "crates/fetchit-cli",
    "crates/fetchit-chat",
    "crates/fetchit-fedi",
    "crates/fetchit-relay-proto",
    "crates/fetchit-relay-server",
    "crates/fetchit-relay-client",
    "crates/fetchit-bridge-server",
    "crates/fetchit-trust",
    "crates/fetchit-trust-types",
    "crates/fetchit-trust-client",
    "crates/fetchit-words",
    "crates/fetchit-mcp",
    "crates/x0xd-client",
]
exclude = ["crates/fetchit-ffi", "apps/fetchit-desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"
homepage = "https://github.com/etchit-io/fetchit"
repository = "https://github.com/etchit-io/fetchit"
authors = ["the fetch>it contributors"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
infer = { version = "0.16", default-features = false }
async-trait = "0.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
hex = "0.4"
log = "0.4"
ant-core = { git = "https://github.com/WithAutonomi/ant-client", rev = "bcab72ae7" }
self_encryption = "=0.36.0"
xor_name = "=5.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
url = { version = "2.5", features = ["serde"] }
base64 = "0.22"
futures-util = "0.3"
postcard = { version = "1.0", default-features = false, features = ["use-std"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "ws", "json", "macros", "query"] }
dashmap = "6.0"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", default-features = false, features = ["trace", "cors"] }
rsa = "0.9"
saorsa-pqc = "0.5"
sha2 = "0.10"
# Exact-pinned: word rendering must match across fetch>it / etch>it / x0x tooling
# (a dictionary change upstream would make the same id read as different words).
four-word-networking = "=2.7.0"
chacha20poly1305 = "0.10"
hkdf = "0.12"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
argon2 = "0.5"
directories = "5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
tempfile = "3.13"
lru = "0.16"

[profile.dev]
# Full DWARF made debug + test artifacts enormous: one x0x rlib was 726 MB
# and a single test binary 561 MB, so a heavy session wrote ~25-30 GB that
# cargo never reclaims (the build disk hit 99% and killed a linker with a
# bus error, 2026-07-25). `line-tables-only` keeps file/line in panics and
# backtraces -- how this codebase is actually debugged, via tracing logs and
# logcat -- and drops only the variable-level DWARF a step debugger would
# want. Inherited by the test and bench profiles.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
