[workspace]
members = [
    "crates/fetchit-core",
    "crates/fetchit-net",
    "crates/fetchit-cli",
    "crates/fetchit-chat",
]
exclude = ["crates/fetchit-ffi", "apps/fetchit-desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"
homepage = "https://github.com/etchit-io/fetchit"
repository = "https://github.com/etchit-io/fetchit"
authors = ["the fetch>it contributors"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
infer = { version = "0.16", default-features = false }
async-trait = "0.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
hex = "0.4"
log = "0.4"
# Temporary pin to jacderida's home-download-fixes fork while the
# residential-saturation download hardening lands upstream. Bumps the
# download path from "aborts on first close-group exhaustion" to
# retries + deferred-retry with 10/30/60s backoff. Re-pin to
# WithAutonomi/ant-client main once the PR merges. etchit is testing
# the same SHA on a local branch in parallel; coordinate the move
# back to mainline.
ant-core = { git = "https://github.com/jacderida/ant-client", rev = "13070d9" }
self_encryption = "=0.36.0"
xor_name = "=5.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
url = "2.5"
base64 = "0.22"
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
