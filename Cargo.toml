[workspace]
members = [
    "crates/fetchit-core",
    "crates/fetchit-net",
    "crates/fetchit-cli",
]
exclude = ["crates/fetchit-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
homepage = "https://github.com/etchit-io/fetchit"
repository = "https://github.com/etchit-io/fetchit"
authors = ["the fetch/it contributors"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
infer = { version = "0.16", default-features = false }
async-trait = "0.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
hex = "0.4"
log = "0.4"
# Pinned to the same revision the etchit FFI ships against — keeps both
# projects aligned with the production network. Bump deliberately.
ant-core = { git = "https://github.com/WithAutonomi/ant-client", rev = "6cada1d" }
self_encryption = "=0.35.0"
xor_name = "=5.0.0"
# uniffi pinned to the etchit-android version to keep both projects on
# the same Kotlin binding generator. Bump deliberately and verify that
# `uniffi-bindgen` (the standalone CLI) still produces matching bindings.
uniffi = "=0.29.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
