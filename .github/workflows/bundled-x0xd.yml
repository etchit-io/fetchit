name: bundled-x0xd

# Manual trigger + PRs that touch the bundled-binary surface. Cloning
# x0x and building a release binary is ~15min on ubuntu-latest, so PRs
# that only touch unrelated crates (chat, relay-client, core, web)
# skip this lane via the `paths` filter. workflow_dispatch always
# triggers regardless of path scope.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/fetchit-desktop/src-tauri/**'
      - 'crates/x0xd-client/**'
      - '.github/workflows/bundled-x0xd.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  X0XD_PIN_SHA: "55b88459b95f120f5902a27bdf8a3268cda414e7"

jobs:
  build-bundled-x0xd:
    name: Build bundled x0xd + fetchit-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fetchit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux webkit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Cache fetchit-desktop build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/fetchit-desktop/src-tauri
          cache-on-failure: true

      - name: Clone pinned josh-clsn/x0x
        run: |
          # josh-clsn fork: upstream v0.34.3 plus the engine-A tail
          # (relay-delivered group-join apply endpoints + join-retry
          # convergence) on the engine-a-34 branch.
          git clone https://github.com/josh-clsn/x0x "$HOME/x0x"
          cd "$HOME/x0x"
          git checkout "$X0XD_PIN_SHA"

      # Cache after clone so Swatinem can hash the freshly-checked-out
      # Cargo.lock when it computes the cache key. With the opposite
      # order the restore-time key uses a fallback (no lock on disk)
      # but the save-time key uses the lock, the two diverge, and the
      # cache never hits across runs.
      - name: Cache x0x build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ~/x0x
          cache-on-failure: true

      - name: Build x0xd
        run: |
          cd "$HOME/x0x"
          # jemalloc: fixes glibc malloc arena/RSS amplification (Linux runner).
          cargo build --release --bin x0xd --features jemalloc

      - name: Build fetchit-desktop with bundled binary
        env:
          FETCHIT_BUNDLED_X0XD_PATH: /home/runner/x0x/target/release/x0xd
          FETCHIT_BUNDLED_X0XD_VERSION: "0.34.3"
        run: |
          cargo build --manifest-path apps/fetchit-desktop/src-tauri/Cargo.toml

      - name: Confirm x0xd staged into resources
        run: |
          ls -lh apps/fetchit-desktop/src-tauri/resources/x0xd/
