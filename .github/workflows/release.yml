name: release

# Triggered by pushing a tag matching `v*` (e.g. `v0.1.0`). Builds the
# signed release APK and the desktop bundles (macOS universal .dmg,
# Linux .AppImage + .deb, Windows .msi + .exe) and uploads all
# artifacts to a single GitHub Release.
#
# ── Android signing (required for a Play-grade APK) ─────────────────
#   KEYSTORE_BASE64   — base64-encoded release keystore (.keystore / .jks)
#   KEYSTORE_PASSWORD — keystore password
#   KEY_ALIAS         — key alias inside the keystore (typically "fetchit")
#   KEY_PASSWORD      — key password (often same as KEYSTORE_PASSWORD)
#
# ── Desktop code-signing (optional — unsigned bundles publish if missing) ──
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
#
# See RELEASING.md for the one-time setup walk-through.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # manual fallback if a tag-push doesn't auto-fire

permissions:
  contents: write  # create the GitHub Release + upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  release-apk:
    name: build + publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ── toolchains ────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fetchit-ffi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install uniffi-bindgen (version must match crates/fetchit-ffi)
        run: cargo install uniffi-bindgen-cli --git https://github.com/mozilla/uniffi-rs --tag v0.29.4

      - name: Set up Android NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      # ── build the JNI .so libraries ───────────────────────────────
      - name: Build fetchit-ffi for Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build-jni-libs.sh

      # ── prep release signing ──────────────────────────────────────
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/fetchit-android/app/fetchit-release.keystore

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > apps/fetchit-android/app/keystore.properties <<EOF
          storeFile=fetchit-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # ── build the release APK ─────────────────────────────────────
      - name: Build release APK
        run: |
          cd apps/fetchit-android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Stage APK (versioned + stable name)
        id: apk
        run: |
          src="apps/fetchit-android/app/build/outputs/apk/release/app-release.apk"
          dst="fetchit-${{ steps.ver.outputs.version }}.apk"
          cp "$src" "$dst"
          sha256sum "$dst" > "$dst.sha256"
          # Stable name too, so `releases/latest/download/app-release.apk` always resolves
          # (this is the URL the etchit.io site links).
          cp "$src" app-release.apk
          echo "apk=$dst" >> "$GITHUB_OUTPUT"
          echo "sha=$dst.sha256" >> "$GITHUB_OUTPUT"

      # ── publish ──────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.sha }}
            app-release.apk
          generate_release_notes: true

  # ── Desktop bundles (Tauri 2) ───────────────────────────────────────
  # macOS universal .dmg, Linux .AppImage + .deb, Windows .msi + .exe.
  # Each matrix leg attaches its native bundles to the same GitHub
  # Release the APK job creates (softprops/action-gh-release upserts on
  # tag, so parallel jobs just append assets to one release).
  release-desktop:
    name: build + publish desktop bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest          # arm64 runner — builds a universal binary
            args: --target universal-apple-darwin
            label: macos-universal
          - platform: ubuntu-22.04          # 22.04 (not 24.04) for AppImage glibc portability
            args: ''
            label: linux-x86_64
          - platform: windows-latest
            args: ''
            label: windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ── toolchains ────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/fetchit-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The macOS universal build needs both Mac targets installed
          # so the linker can produce a fat binary in one pass.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # `fetchit-desktop` is workspace-excluded — cache its own Cargo.lock
      # tree, not the root workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/fetchit-desktop/src-tauri

      # Tauri 2 on Linux needs WebKitGTK 4.1 + librsvg + libappindicator
      # + patchelf for AppImage post-processing. Ubuntu 22.04 has all of
      # these in main.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Install frontend deps
        working-directory: apps/fetchit-desktop
        run: npm ci

      # ── Optional Apple code-signing + notarisation ────────────────
      # Only stages the env vars when the cert secret is non-empty. We
      # write them via $GITHUB_ENV instead of putting them on tauri-
      # action's `env:` block, because expression interpolation of an
      # unset secret yields the empty string — and tauri-action
      # interprets a defined-but-empty APPLE_CERTIFICATE as "import
      # this," then `security import` fails on the empty content
      # (that was the original macOS-leg failure mode on v0.2.1-rc1).
      - name: Stage Apple signing credentials
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE:           ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:      ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:              ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE not configured — bundle will be unsigned (Gatekeeper warning on first launch)."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      # ── Optional Windows code-signing ─────────────────────────────
      # Same pattern as Apple: only stages WINDOWS_CERTIFICATE_FILE and
      # _PASSWORD into $GITHUB_ENV when the cert secret is set, so an
      # unset cert produces an unsigned bundle (SmartScreen warning)
      # rather than failing the build.
      - name: Stage Windows signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WIN_CERT:     ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CERT_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WIN_CERT) {
            Write-Host "WINDOWS_CERTIFICATE not configured — bundle will be unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "fetchit-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT))
          @(
            "WINDOWS_CERTIFICATE_FILE=$pfx",
            "WINDOWS_CERTIFICATE_PASSWORD=$env:WIN_CERT_PWD"
          ) | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      # ── Build + publish (tauri-action handles bundle discovery) ───
      # No signing env vars on this step — the Stage Apple / Stage
      # Windows steps above export them into $GITHUB_ENV ONLY when the
      # secrets are populated. Unset → unsigned but installable bundle.
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/fetchit-desktop
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: ${{ steps.ver.outputs.tag }}
          releaseDraft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          args: ${{ matrix.args }}

      # Verify the Linux .deb's .desktop passes the URL to fetchit via %u.
      # Without it, autonomi:// clicks launch fetch>it but the URL never
      # reaches the app. Tauri's default desktop template has been observed
      # to omit %u in some bundler versions; we override with
      # src-tauri/desktop-entry.desktop and this step fails the release
      # if that override ever stops being applied.
      - name: Verify .deb's .desktop has %u
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          deb=$(find apps/fetchit-desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$deb" || { echo "::error::no .deb produced"; exit 1; }
          mkdir -p /tmp/deb-check
          dpkg-deb -x "$deb" /tmp/deb-check
          dt=$(find /tmp/deb-check/usr/share/applications -name '*.desktop' -print -quit)
          test -n "$dt" || { echo "::error::no .desktop file in .deb"; exit 1; }
          echo "found $dt"
          grep ^Exec= "$dt"
          grep -q '^Exec=.* %u' "$dt" || {
            echo "::error file=apps/fetchit-desktop/src-tauri/desktop-entry.desktop::Generated .desktop has no %u in Exec= — autonomi:// clicks will launch fetch>it without the URL"
            cat "$dt"
            exit 1
          }
          echo "  ✓ %u present"
