name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Builds the Android debug APK end-to-end (FFI .so via cargo-ndk +
  # gradle assembleDebug). Catches breakage in the gradle build, the
  # NDK toolchain, or the JNI handoff before a release tag. The
  # signed-release path is a separate workflow (.github/workflows/
  # release.yml) triggered only on `v*` tag pushes.
  android:
    name: android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fetchit-ffi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install uniffi-bindgen (version must match crates/fetchit-ffi)
        run: cargo install uniffi-bindgen --version =0.29.4

      - name: Set up Android NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      - name: Build fetchit-ffi for arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build-jni-libs.sh

      - name: Build debug APK
        run: |
          cd apps/fetchit-android
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetchit-debug-apk
          path: apps/fetchit-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
