name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cost control: auto-cancel a superseded run on the same ref rather than
# paying for both. A fresh push to a branch/PR kills its own in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Do NOT set a global RUSTFLAGS: "-D warnings" here. It forces -D warnings onto
  # UPSTREAM dependency builds (bypassing cargo's default --cap-lints allow for
  # non-workspace crates) and onto `cargo install` tool builds -- turning THEIR
  # lints fatal on a newer toolchain: the x0x sibling on windows-clippy, the
  # uniffi-bindgen-cli install (android job), and the E2E onPrepare desktop build
  # (missing binary). Our own warning gate is clippy's explicit `-- -D warnings`
  # (see the clippy jobs below), which caps dependency lints at allow.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # fetchit-ffi and apps/fetchit-desktop/src-tauri are excluded from the
      # workspace — `--all` skips them. Check their formatting explicitly.
      - run: cargo fmt --manifest-path crates/fetchit-ffi/Cargo.toml -- --check
      - run: cargo fmt --manifest-path apps/fetchit-desktop/src-tauri/Cargo.toml -- --check

  pins:
    # Fail CI if Cargo.lock / Cargo.toml / settings.rs drift from
    # PINS.md. A silent crate bump can land a wire-format change
    # between releases — historical messages stop decrypting, contact
    # cards reject. The check is one shell script + cheap to run.
    name: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-pins.sh

  # License-compliance gate. Runs cargo-deny against all three
  # distributed-binary dependency graphs -- the root workspace and the two
  # workspace-excluded units (src-tauri, fetchit-ffi), each carrying its own
  # Cargo.lock -- against the single root deny.toml. Every crate that links
  # into a shipped binary must carry a cleared license; a new copyleft
  # dependency fails here instead of slipping in. The Autonomi stack pulls two
  # GPL-3.0 crates (self_encryption, which has a linking exception, and evmlib,
  # which does not) -- both pinned by name in deny.toml, so a third copyleft
  # crate is rejected. cargo-deny only reads metadata, so no build/cache step.
  licenses:
    name: licenses (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone x0x fork sibling (fetchit-ffi path dep)
        run: git clone --depth 1 --branch mobile-0.27 https://github.com/josh-clsn/x0x ../x0x-fork
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny check licenses (all three lockfiles)
        run: |
          for m in Cargo.toml apps/fetchit-desktop/src-tauri/Cargo.toml crates/fetchit-ffi/Cargo.toml; do
            echo "::group::cargo-deny licenses :: $m"
            cargo deny --manifest-path "$m" check licenses --config deny.toml
            echo "::endgroup::"
          done

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cost control: macOS (10x billing) + Windows (2x) run only on
        # release tags or a manual dispatch. Routine push/PR is ubuntu-only.
        os: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone x0x fork sibling (fetchit-ffi path dep)
        run: git clone --depth 1 --branch mobile-0.27 https://github.com/josh-clsn/x0x ../x0x-fork
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (keyring→secret-service, Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # fetchit-ffi and apps/fetchit-desktop/src-tauri are excluded from the
      # workspace — the line above skips them. Lint them explicitly so clippy
      # drift can't accumulate unseen in the excluded crates AND so cfg(windows)
      # / cfg(target_os = "macos") branches actually get checked on the runner
      # where they compile.
      # RUSTFLAGS emptied so the x0x-fork path dep (and other deps) aren't gated
      # on -D warnings: a dependency's warning under a newer rustc must not fail
      # our CI. `-- -D warnings` still gates fetchit-ffi's OWN code strictly.
      - name: Clippy fetchit-ffi
        env:
          RUSTFLAGS: ""
        run: cargo clippy --manifest-path crates/fetchit-ffi/Cargo.toml --all-targets -- -D warnings
      - name: Install Tauri system deps (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev
      - run: cargo clippy --manifest-path apps/fetchit-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cost control: macOS (10x billing) + Windows (2x) run only on
        # release tags or a manual dispatch. Routine push/PR is ubuntu-only.
        os: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (keyring→secret-service, Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # No --all-features: it would pull fetchit-net's `devnet-tests`
      # feature — an opt-in LocalDevnet suite that links ant-node and
      # needs the `anvil` + `ant` binaries — into every CI build. That
      # suite is run locally / pre-release, not here.
      - run: cargo test --workspace

  # Desktop app — runs the Vite/TS frontend suite (vitest) and the Tauri
  # backend suite (src-tauri). src-tauri is excluded from the root
  # workspace (it links the system webkit stack), so `cargo test
  # --workspace` in the `test` job never sees it. Linux only; the tests
  # are platform-agnostic logic. desktop-test.yml builds bundles — this
  # job runs tests.
  desktop:
    name: desktop (vitest + src-tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/fetchit-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/fetchit-desktop/src-tauri

      - name: Install frontend deps
        working-directory: apps/fetchit-desktop
        run: npm ci

      # Fast TS/Vite suite first — fails in seconds if a renderer regressed.
      - name: Frontend unit tests (vitest)
        working-directory: apps/fetchit-desktop
        run: npm run test:run

      - name: Install Linux webkit deps (for the src-tauri build)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Backend unit tests (src-tauri)
        run: cargo test --manifest-path apps/fetchit-desktop/src-tauri/Cargo.toml

  # Desktop GUI end-to-end tests — drives the real built Tauri app through
  # tauri-driver (WebDriver) + WebdriverIO: cold launch and address-bar
  # validation, no network. Linux only — tauri-driver has no macOS
  # (WKWebView) support. wdio.conf.mjs's onPrepare hook builds the debug
  # binary; xvfb supplies the headless runner a display.
  desktop-e2e:
    name: desktop (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/fetchit-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/fetchit-desktop/src-tauri

      - name: Install Linux webkit + WebDriver deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            webkit2gtk-driver \
            xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install frontend deps
        working-directory: apps/fetchit-desktop
        run: npm ci

      # onPrepare builds the debug binary; xvfb-run supplies the display.
      - name: Run desktop E2E (WebdriverIO)
        working-directory: apps/fetchit-desktop
        run: xvfb-run --auto-servernum npm run e2e

  # Cross-browser extension. Runs the address-parser unit tests under plain
  # Node (no package.json, no deps — just node --test). If you change the
  # parser, this job is what catches divergence with the desktop-app parser.
  web-extension:
    name: web extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: addr.js parser tests
        run: node --test apps/fetchit-web/test/addr.test.mjs
      - name: both manifests are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('apps/fetchit-web/manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/fetchit-web/manifest.firefox.json', 'utf8'))"
      - name: Chrome manifest declares service_worker, not scripts
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('apps/fetchit-web/manifest.json','utf8'));
            if (!m.background.service_worker) throw new Error('manifest.json missing background.service_worker (Chrome rejects)');
            if (m.background.scripts) throw new Error('manifest.json has background.scripts (Chrome MV3 forbids it)');
          "
      - name: Firefox manifest declares scripts, not service_worker
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('apps/fetchit-web/manifest.firefox.json','utf8'));
            if (!m.background.scripts) throw new Error('manifest.firefox.json missing background.scripts (Firefox needs it until SW pref is default-on)');
            if (m.background.service_worker) throw new Error('manifest.firefox.json has background.service_worker (Firefox pref is off by default; would prompt user to add scripts)');
          "
      - name: background.js parses as ES module
        run: node --input-type=module -e "import('./apps/fetchit-web/src/addr.js').then(() => console.log('addr.js OK'))"

  # Runs the Android JVM unit tests + the fetchit-ffi host unit tests,
  # then builds the debug APK end-to-end
  # (FFI .so via cargo-ndk + gradle assembleDebug). Catches logic
  # regressions and breakage in the gradle build, the NDK toolchain, or
  # the JNI handoff before a release tag. The signed-release path is a
  # separate workflow (.github/workflows/release.yml), `v*` tags only.
  android:
    name: android (unit tests + debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone x0x fork sibling (fetchit-ffi path dep)
        run: git clone --depth 1 --branch mobile-0.27 https://github.com/josh-clsn/x0x ../x0x-fork

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # JVM unit tests — pure logic, no NDK / FFI needed, so they run first
      # to fail fast before the slower native build below.
      - name: Run Android unit tests
        run: |
          cd apps/fetchit-android
          ./gradlew :app:testDebugUnitTest --no-daemon

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fetchit-ffi

      - name: Install libdbus (keyring→secret-service, host build)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # fetchit-ffi host unit tests — rendition-mapping logic. The crate is
      # workspace-excluded (cdylib for the JNI build), so the `test` job's
      # `cargo test --workspace` never runs them. Host target; no NDK needed.
      - name: Test fetchit-ffi (host unit tests)
        run: cargo test --manifest-path crates/fetchit-ffi/Cargo.toml

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install uniffi-bindgen (version must match crates/fetchit-ffi)
        # RUSTFLAGS emptied: this compiles an external tool whose transitive deps
        # must not be gated on our -D warnings (a newer rustc warns inside
        # uniffi_internal_macros, which would otherwise fail the install).
        env:
          RUSTFLAGS: ""
        run: cargo install uniffi-bindgen-cli --git https://github.com/mozilla/uniffi-rs --tag v0.29.5

      # The android job died with "No space left on device" (ENOSPC): first the
      # arm64 cross-compile overflowed, and once that was fixed the NDK *setup*
      # step itself ENOSPC'd copying r27 into the tool cache. It's DISK, not
      # memory/CPU: the NDK (extracted + copied to the tool cache), the earlier
      # host-target `fetchit-ffi` build, and the gradle caches together exhaust
      # the runner's ~14 GB root disk. (Measured build peak is only ~4.6 GB RAM —
      # an earlier swap step was the wrong fix and its 12 GB swapfile only made
      # the fill worse.) Reclaim the large unused pre-installed toolchains BEFORE
      # the NDK setup and the compile — none are needed by the Rust or Android
      # build, and the NDK download is the first thing that needs the headroom.
      # `df -h` brackets the reclaim so the log shows the space won.
      - name: Free disk space for the Android build
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell 2>/dev/null || true
          echo "after:"; df -h /

      - name: Set up Android NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      - name: Build fetchit-ffi for arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          # RUSTFLAGS emptied: this cross-compiles the full external dependency
          # tree (x0x-fork + ant-core + saorsa + …), which must NOT be gated on
          # our global `-D warnings` — same reason as the clippy-fetchit-ffi and
          # uniffi-bindgen steps above (e.g. x0x-fork's cli/daemon.rs carries
          # unused-variable warnings that would otherwise fail the release
          # build). fetchit-ffi's OWN code is still gated strictly by the
          # dedicated clippy job.
          RUSTFLAGS: ""
        run: ./scripts/build-jni-libs.sh

      - name: Build debug APK
        run: |
          cd apps/fetchit-android
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetchit-debug-apk
          path: apps/fetchit-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Doc-drift prevention (Phase 1): three shell guards + the rustdoc
  # broken-intra-doc-link gate. The tripwire tests (handler order /
  # Rendition + EnvelopeKind variants / crate list) run in the `test` job
  # via `cargo test`; this job enforces the rest so stale docs cannot land.
  docs-gates:
    name: doc drift gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the stale-phrase linter can diff new doc-comments
          # against the PR base (or the push parent).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (keyring→secret-service)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: crate list matches cargo metadata
        run: sh scripts/check-crate-list.sh
      - name: doc-comment paths resolve
        run: sh scripts/check-doc-paths.sh
      - name: no expiring markers in new doc-comments
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base ref (initial push); skipping stale-phrase diff"
          else
            sh scripts/check-stale-phrases.sh "$base"
          fi
      # Informational only (no --strict, plus `|| true`): surfaces sections of
      # ARCHITECTURE.md whose globbed files changed since their `verified=`
      # stamp, without failing CI yet. The milestone-close sweep consumes the
      # warnings to target re-verification. Needs the full history fetched above.
      - name: ARCHITECTURE.md stamps (informational)
        run: sh scripts/check-arch-stamps.sh || true
      # rustdoc broken-intra-doc-link gate. Run with fetchit-relay-server's
      # `fediverse-inbox` feature so the inbox module docs (and server.rs
      # references to them) are covered and resolve. NOT --all-features: that
      # pulls fetchit-net's devnet-tests (ant-node) for zero link-coverage gain.
      - name: rustdoc has no broken intra-doc links
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps -F fetchit-relay-server/fediverse-inbox
